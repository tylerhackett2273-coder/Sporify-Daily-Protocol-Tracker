<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sporify · Daily Protocol Tracker</title>
<meta name="description" content="Your personal Sporify protocol tracker. Log your daily stack, build streaks, and follow your 365 day roadmap." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#101018; }
  body { min-height:100vh; -webkit-text-size-adjust:100%; }
</style>
</head>
<body>
<div id="sp-root"></div>
<style>
  #sp-root, #sp-root * { box-sizing: border-box; }
  #sp-root {
    --ink:#101018;
    --deep:#000808;
    --steel:#384858;
    --slate:#405868;
    --silver:#c8c8c8;
    --white:#ffffff;
    --neutral:#f5f5f5;
    --good:#7fb9a8;
    --warn:#4a7a9b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--ink);
    color: var(--white);
    min-height: 100vh;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  #sp-root .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 0.02em; }

  /* ---------- shell ---------- */
  .sp-wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }

  .sp-header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
  .sp-wordmark { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; text-transform: lowercase; }
  .sp-wordmark span { color: var(--silver); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; display:block; margin-top:2px; font-weight: 500; }
  .sp-brand { display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .sp-logo { display:block; width:118px; max-width:42vw; height:auto; }
  .sp-eyebrow { color: var(--silver); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 500; }
  .sp-header-actions { display:flex; align-items:center; gap:8px; }
  .sp-reset { background:none; border:1px solid #2a2a36; color:var(--silver); font-size:11px; padding:7px 12px; border-radius:6px; cursor:pointer; letter-spacing:0.04em; text-transform:uppercase; }
  .sp-reset:hover { border-color: var(--steel); color: var(--white); }

  /* ---------- storage notice ---------- */
  .sp-storage-note { display:flex; align-items:flex-start; gap:10px; background:#15151f; border:1px solid #262633; border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:12px; color:var(--silver); line-height:1.55; }
  .sp-storage-note svg { flex-shrink:0; margin-top:1px; width:15px; height:15px; }
  .sp-storage-note b { color: var(--white); font-weight:600; }
  .sp-storage-note .sp-storage-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .sp-storage-link { background:none; border:none; color:var(--good); font-size:11.5px; font-weight:600; cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px; }
  .sp-storage-link:hover { color:#9fd0c0; }
  .sp-storage-dismiss { position:absolute; top:8px; right:8px; background:none; border:none; color:#55555f; cursor:pointer; font-size:12px; padding:4px; line-height:1; }
  .sp-storage-note { position:relative; padding-right:30px; }
  .sp-storage-dismiss:hover { color:var(--silver); }

  /* ---------- onboarding ---------- */
  .sp-onboard { background: linear-gradient(165deg, #15151f 0%, var(--deep) 100%); border:1px solid #232330; border-radius: 14px; padding: 32px 28px; }
  .sp-onboard h1 { font-size: 26px; line-height:1.25; margin: 0 0 10px; letter-spacing: -0.01em; }
  .sp-onboard p { color: var(--silver); font-size: 14px; line-height: 1.6; margin: 0 0 24px; max-width: 480px; }
  .sp-grid-pick { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
  @media (max-width: 540px){ .sp-grid-pick { grid-template-columns: 1fr; } }
  .sp-pick { background:#15151f; border:1px solid #262633; border-radius:10px; padding:14px 14px; cursor:pointer; transition: border-color .15s, background .15s; }
  .sp-pick:hover { border-color: var(--steel); }
  .sp-pick.active { border-color: var(--slate); background: linear-gradient(135deg, rgba(64,88,104,0.25), rgba(56,72,88,0.1)); }
  .sp-pick-name { font-size: 14px; font-weight: 600; }
  .sp-pick-time { font-size: 11px; color: var(--silver); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
  .sp-timing { display:inline-flex; gap:3px; margin-top:10px; background:#101018; border:1px solid #262633; border-radius:8px; padding:3px; }
  .sp-time-opt { background:none; border:none; color:var(--silver); font-size:11px; font-weight:600; letter-spacing:0.06em; padding:5px 14px; border-radius:5px; cursor:pointer; text-transform:uppercase; transition: all .15s; }
  .sp-time-opt.on { background: var(--slate); color: var(--white); }
  .sp-time-opt:not(.on):hover { color: var(--white); }
  .sp-timing-note { font-size: 12.5px; color: var(--silver); line-height:1.6; margin: 0 0 22px; max-width: 500px; }
  .sp-timing-note b { color: var(--white); font-weight: 600; }
  .sp-start-btn { background: var(--white); color: var(--ink); border:none; padding: 13px 26px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor:pointer; letter-spacing:0.01em; }
  .sp-start-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .sp-start-btn:not(:disabled):hover { background: var(--neutral); }
  .sp-onboard-restore { margin-top:16px; padding-top:16px; border-top:1px solid #232330; }
  .sp-onboard-restore p { font-size:12.5px; margin:0 0 10px; max-width:none; }

  /* ---------- ring + today card ---------- */
  .sp-today { display:grid; grid-template-columns: 150px 1fr; gap: 24px; background: linear-gradient(165deg, #14141e 0%, var(--deep) 100%); border:1px solid #232330; border-radius: 14px; padding: 24px; margin-bottom: 18px; }
  @media (max-width: 560px){ .sp-today { grid-template-columns: 1fr; } .sp-ring-col { display:flex; align-items:center; gap:16px; } }
  .sp-ring-col { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .sp-ring-wrap { position:relative; width:130px; height:130px; }
  .sp-ring-wrap svg { transform: rotate(-90deg); }
  .sp-ring-num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .sp-ring-num b { font-size:30px; font-family:'SF Mono', Menlo, monospace; line-height:1; }
  .sp-ring-num small { font-size:9px; color:var(--silver); text-transform:uppercase; letter-spacing:0.12em; margin-top:4px; }

  .sp-phase-tag { font-size:10px; text-transform:uppercase; letter-spacing:0.14em; color: var(--slate-text, #8fb0c8); margin-top: 10px; text-align:center; }

  .sp-today-main h2 { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color: var(--silver); margin: 0 0 4px; font-weight: 600; }
  .sp-today-date { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .sp-checklist { display:flex; flex-direction:column; gap:8px; }
  .sp-item { display:flex; align-items:center; gap:12px; padding: 10px 12px; border-radius:9px; background:#15151f; border:1px solid #232330; cursor:pointer; transition: all .15s; }
  .sp-item:hover { border-color:#33333f; }
  .sp-item.done { background: linear-gradient(135deg, rgba(127,185,168,0.12), rgba(127,185,168,0.04)); border-color: rgba(127,185,168,0.4); }
  .sp-check { width:20px; height:20px; border-radius:5px; border:1.5px solid #3a3a48; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition: all .15s; }
  .sp-item.done .sp-check { background: var(--good); border-color: var(--good); }
  .sp-check svg { width:12px; height:12px; opacity:0; transition: opacity .15s; }
  .sp-item.done .sp-check svg { opacity:1; }
  .sp-item-name { font-size:14px; font-weight:500; flex:1; }
  .sp-item-time { font-size:10px; color:var(--silver); text-transform:uppercase; letter-spacing:0.08em; }
  .sp-item-timing { cursor:pointer; border:1px solid #2a2a36; padding:4px 11px; border-radius:20px; line-height:1; transition: all .15s; }
  .sp-item-timing:hover { border-color: var(--slate); color: var(--white); }
  .sp-item.done .sp-item-timing { opacity:0.7; }
  .sp-item.done .sp-item-name { color: var(--silver); text-decoration: line-through; text-decoration-color: #3a3a48; }

  .sp-all-done { margin-top: 12px; font-size: 12.5px; color: var(--good); display:flex; align-items:center; gap:6px; }

  /* ---------- stat row ---------- */
  .sp-stats { display:grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 18px; }
  .sp-stat { background:#15151f; border:1px solid #232330; border-radius: 12px; padding: 16px; text-align:center; }
  .sp-stat b { display:block; font-size: 24px; font-family:'SF Mono', Menlo, monospace; }
  .sp-stat span { font-size: 10.5px; color:var(--silver); text-transform:uppercase; letter-spacing:0.08em; }

  /* ---------- year grid ---------- */
  .sp-year-card { background: linear-gradient(165deg, #14141e 0%, var(--deep) 100%); border:1px solid #232330; border-radius:14px; padding:22px; margin-bottom: 18px; overflow-x:auto;}
  .sp-year-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:6px;}
  .sp-year-head h3 { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color:var(--silver); margin:0; font-weight:600; }
  .sp-year-legend { font-size: 10.5px; color: var(--silver); display:flex; align-items:center; gap:5px; }
  .sp-legend-sq { width:9px; height:9px; border-radius:2px; display:inline-block; }
  .sp-grid-scroll { min-width: 640px; }
  .sp-months-row { display:flex; gap:3px; margin-bottom:4px; padding-left: 28px; font-size:10px; color:var(--silver); }
  .sp-weeks { display:flex; gap:3px; }
  .sp-dow { display:flex; flex-direction:column; gap:3px; padding-right:6px; }
  .sp-dow span { width:18px; height:11px; font-size:9px; color:var(--silver); display:flex; align-items:center; }
  .sp-week { display:flex; flex-direction:column; gap:3px; }
  .sp-day { width:11px; height:11px; border-radius:2.5px; background:#1c1c27; cursor:default; }
  .sp-day.future { background:#15151a; }
  .sp-day.partial { background: rgba(74,122,155,0.55); }
  .sp-day.full { background: var(--good); }
  .sp-day.today { box-shadow: 0 0 0 1.5px var(--white); }
  .sp-day.missed { background:#1a1f2a; }

  /* ---------- phase roadmap ---------- */
  .sp-phases { background: linear-gradient(165deg, #14141e 0%, var(--deep) 100%); border:1px solid #232330; border-radius:14px; padding:22px; margin-bottom:18px; }
  .sp-phases h3 { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color:var(--silver); margin:0 0 16px; font-weight:600; }
  .sp-phase-row { display:flex; gap:14px; padding: 12px 0; border-top:1px solid #1f1f29; }
  .sp-phase-row:first-of-type { border-top:none; }
  .sp-phase-days { width:64px; flex-shrink:0; font-family:'SF Mono', Menlo, monospace; font-size:11px; color:var(--silver); padding-top:2px;}
  .sp-phase-body b { font-size: 14px; display:block; margin-bottom:2px; }
  .sp-phase-body p { margin:0; font-size:12.5px; color:var(--silver); line-height:1.5; }
  .sp-phase-row.active .sp-phase-days, .sp-phase-row.active b { color: var(--white); }
  .sp-phase-row.active b::before { content:"● "; color: var(--good); }
  .sp-phase-row:not(.active) { opacity:0.55; }

  /* ---------- milestones ---------- */
  .sp-milestones { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 22px; }
  .sp-badge { font-size:11px; padding:7px 12px; border-radius:20px; border:1px solid #262633; color:var(--silver); display:flex; align-items:center; gap:6px; }
  .sp-badge.hit { border-color: rgba(127,185,168,0.5); color: var(--good); background: rgba(127,185,168,0.08); }

  /* schedule: time input + wrappers */
  .sp-sched { display:inline-flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .sp-item-sched { display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
  .sp-time-input { background:#101018; border:1px solid #262633; color:var(--white); font-family:'JetBrains Mono','SF Mono',Menlo,monospace; font-size:12px; padding:5px 7px; border-radius:7px; cursor:pointer; color-scheme:dark; }
  .sp-time-input:hover { border-color: var(--slate); }

  /* clickable calendar cells */
  .sp-day.clickable { cursor:pointer; }
  .sp-day.clickable:hover { box-shadow: 0 0 0 1.5px var(--steel); }

  /* day-detail modal */
  .sp-modal-bg { position:fixed; inset:0; background:rgba(4,6,10,0.78); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .sp-modal { background: linear-gradient(165deg,#15151f 0%, var(--deep) 100%); border:1px solid #2a2a3a; border-radius:16px; width:100%; max-width:440px; max-height:86vh; overflow-y:auto; padding:24px; }
  .sp-modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .sp-modal-head h3 { font-size:18px; margin:0; letter-spacing:-0.01em; }
  .sp-modal-sub { font-size:11px; color:var(--silver); margin:3px 0 18px; text-transform:uppercase; letter-spacing:0.1em; }
  .sp-modal-close { background:none; border:1px solid #2a2a36; color:var(--silver); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:13px; line-height:1; flex-shrink:0; }
  .sp-modal-close:hover { border-color: var(--steel); color: var(--white); }
  .sp-dlist { display:flex; flex-direction:column; gap:8px; }
  .sp-drow { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; background:#15151f; border:1px solid #232330; cursor:pointer; transition: all .15s; }
  .sp-drow:hover { border-color:#33333f; }
  .sp-drow.taken { background: linear-gradient(135deg, rgba(127,185,168,0.12), rgba(127,185,168,0.04)); border-color: rgba(127,185,168,0.4); }
  .sp-dcheck { width:20px; height:20px; border-radius:6px; border:1.5px solid #3a3a48; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .sp-drow.taken .sp-dcheck { background: var(--good); border-color: var(--good); }
  .sp-dcheck svg { width:12px; height:12px; opacity:0; }
  .sp-drow.taken .sp-dcheck svg { opacity:1; }
  .sp-dname { flex:1; font-size:13.5px; font-weight:500; }
  .sp-dmuted { font-size:11px; color:#55555f; text-transform:uppercase; letter-spacing:0.08em; }
  .sp-modal-note { font-size:11.5px; color:#55555f; line-height:1.5; margin:16px 0 0; text-align:center; }
  /* ---------- daily reflection notes ---------- */
  .sp-notes-wrap { margin-top:18px; }
  .sp-notes-label { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--silver); font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sp-notes-label svg { width:13px; height:13px; opacity:0.7; }
  .sp-notes-area { width:100%; background:#101018; border:1px solid #262633; border-radius:10px; color:var(--white); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:13.5px; line-height:1.65; padding:12px 14px; resize:none; min-height:96px; outline:none; transition: border-color .15s; overflow:hidden; }
  .sp-notes-area::placeholder { color:#44444e; }
  .sp-notes-area:focus { border-color: var(--slate); }
  .sp-notes-saved { font-size:11px; color:#44554e; margin-top:6px; text-align:right; letter-spacing:0.03em; transition: color .3s; }
  .sp-notes-saved.flash { color: var(--good); }
  /* manage stack */
  .sp-manage-btn { width:100%; margin-top:14px; background:none; border:1px dashed #2f2f3c; color:var(--silver); font-size:12.5px; font-weight:500; padding:11px; border-radius:10px; cursor:pointer; letter-spacing:0.01em; transition: all .15s; }
  .sp-manage-btn:hover { border-color: var(--steel); color: var(--white); background:#15151f; }
  .sp-mctrl { display:flex; align-items:center; }
  .sp-mctrl .sp-sched { margin-top:0; }
  .sp-modal-note b { color: var(--silver); }
  /* ---------- monthly glance ---------- */
  .sp-month-card { background: linear-gradient(165deg,#14141e 0%, var(--deep) 100%); border:1px solid #232330; border-radius:14px; padding:22px; margin-bottom:18px; }
  .sp-month-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .sp-month-head h3 { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color:var(--silver); margin:0; font-weight:600; }
  .sp-month-nav { display:flex; align-items:center; gap:8px; }
  .sp-mnav { background:#15151f; border:1px solid #262633; color:var(--white); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; }
  .sp-mnav:hover { border-color:var(--steel); }
  .sp-month-label { font-size:14px; font-weight:600; min-width:128px; text-align:center; }
  .sp-month-today { background:none; border:1px solid #2a2a36; color:var(--silver); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; padding:7px 11px; border-radius:7px; cursor:pointer; }
  .sp-month-today:hover { border-color:var(--steel); color:var(--white); }
  .sp-month-dow { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .sp-month-dow span { text-align:center; font-size:10px; color:var(--silver); text-transform:uppercase; letter-spacing:0.04em; }
  .sp-month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .sp-mday { aspect-ratio:1/1; border-radius:8px; background:#1c1c27; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--silver); }
  .sp-mday.blank { background:transparent; }
  .sp-mday.future { background:#15151a; color:#3a3a48; }
  .sp-mday.partial { background:rgba(74,122,155,0.55); color:#d0e8f5; font-weight:600; }
  .sp-mday.full { background:var(--good); color:#08130f; font-weight:600; }
  .sp-mday.missed { background:#1a1f2a; color:#4a5a6a; }
  .sp-mday.clickable { cursor:pointer; transition: box-shadow .12s; }
  .sp-mday.clickable:hover { box-shadow:0 0 0 1.5px var(--steel); }
  .sp-mday.today { box-shadow:0 0 0 1.5px var(--white); }
  .sp-month-legend { font-size:10.5px; color:var(--silver); display:flex; align-items:center; gap:5px; margin-top:14px; }

  /* ---------- data card (export / import) ---------- */
  .sp-data-card { background: linear-gradient(165deg,#14141e 0%, var(--deep) 100%); border:1px solid #232330; border-radius:14px; padding:22px; margin-bottom:18px; }
  .sp-data-card h3 { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color:var(--silver); margin:0 0 8px; font-weight:600; }
  .sp-data-card p { font-size:12.5px; color:var(--silver); line-height:1.6; margin:0 0 16px; max-width:520px; }
  .sp-data-row { display:flex; gap:10px; flex-wrap:wrap; }
  .sp-data-btn { background:#15151f; border:1px solid #262633; color:var(--white); font-size:12.5px; font-weight:600; padding:10px 16px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition: all .15s; }
  .sp-data-btn:hover { border-color: var(--steel); }
  .sp-data-btn svg { width:14px; height:14px; flex-shrink:0; }
  .sp-data-status { font-size:11.5px; margin-top:10px; color: var(--good); display:none; }
  .sp-data-status.show { display:block; }
  .sp-data-status.error { color:#d98a8a; }

  .sp-footer-note { text-align:center; font-size: 12px; color: #55555f; line-height:1.6; }
</style>

<script>
(function(){
  const PRODUCTS = [

    {id:'coffee', name:'Ground Coffee Mushroom Fusion', time:'AM'},
    {id:'shroomstrips', name:'Shroom Strips', time:'AM'},
    {id:'claritystrips', name:'Clarity Strips', time:'PM'},

  ];

  const PHASES = [

    {range:[8,30], name:'Calibration', desc:'As your routine gets stronger through the first week, the things to notice are steadiness, focus, and how the habit starts to feel like a natural part of your day. For many people, this tends to grow as the days add up.'},
    {range:[31,90], name:'Compounding', desc:'This is the part where staying consistent matters most. For a lot of people, a steady daily routine makes the calm, focused feeling they want easier to keep, instead of having to chase it.'},
    {range:[91,365], name:'Mastery', desc:'By now the routine runs on its own. It is not a task anymore, just a normal part of your day. From here, it is about sticking with the habit that helps you feel the way you want, for the long run.'},
  ];

  const MILESTONES = [3,7,14,30,60,90,180,270,365];

  const root = document.getElementById('sp-root');
  const todayStr = () => new Date().toISOString().slice(0,10);
  const dayDiff = (a,b) => Math.floor((b-a)/86400000);

  let state = { products: [], startDate: null, checkins: {}, timing: {}, schedTime: {}, meta: {}, notes: {} };
  let loaded = false;
  let storageNoteDismissed = false;
  let importStatus = null; // {ok:boolean, msg:string} | null

  function loadState(){
    try {
      const r = localStorage.getItem('sporify-tracker-state');
      if (r) state = JSON.parse(r);
    } catch(e){ /* no existing state */ }
    try {
      storageNoteDismissed = localStorage.getItem('sporify-storage-note-dismissed') === '1';
    } catch(e){ /* ignore */ }
    if (!state.timing) state.timing = {};
    if (!state.schedTime) state.schedTime = {};
    if (!state.checkins) state.checkins = {};
    if (Array.isArray(state.products)) state.products = state.products.filter(id => PRODUCTS.some(p => p.id === id));
    if (!state.meta) state.meta = {};
    if (!state.notes) state.notes = {};
    // backfill membership history for products that predate the stack-editing feature
    (state.products || []).forEach(id => {
      if (!state.meta[id]) state.meta[id] = { addedOn: state.startDate || todayStr(), removedOn: null };
    });
    // migrate legacy boolean check-ins (true) -> taken, time unknown
    Object.keys(state.checkins).forEach(k => {
      const rec = state.checkins[k]; if (!rec) return;
      Object.keys(rec).forEach(id => { if (rec[id] === true) rec[id] = '\u00b7'; });
    });
    loaded = true;
    render();
  }
  function saveState(){
    try { localStorage.setItem('sporify-tracker-state', JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }

  function dismissStorageNote(){
    storageNoteDismissed = true;
    try { localStorage.setItem('sporify-storage-note-dismissed', '1'); } catch(e){ /* ignore */ }
    render();
  }

  function dayNumber(){
    if (!state.startDate) return 1;
    return dayDiff(new Date(state.startDate), new Date(todayStr())) + 1;
  }

  function currentPhase(d){
    return PHASES.find(p => d >= p.range[0] && d <= p.range[1]) || PHASES[PHASES.length-1];
  }

  function computeStreak(){
    let streak = 0;
    let d = new Date(todayStr());
    while (true) {
      const key = d.toISOString().slice(0,10);
      const rec = state.checkins[key] || {};
      const expected = expectedOn(key);
      const total = expected.length;
      const completed = expected.filter(id => rec[id]).length;
      const isToday = key === todayStr();
      if (total > 0 && completed === total) {
        streak++;
        d = new Date(d.getTime() - 86400000);
      } else if (isToday) {
        d = new Date(d.getTime() - 86400000);
        continue;
      } else {
        break;
      }
    }
    return streak;
  }

  function totalFullDays(){
    return Object.keys(state.checkins).filter(key => {
      const rec = state.checkins[key] || {};
      const expected = expectedOn(key);
      if (expected.length === 0) return false;
      return expected.filter(id => rec[id]).length === expected.length;
    }).length;
  }

  function toggleProduct(id){
    const i = state.products.indexOf(id);
    if (i >= 0) state.products.splice(i,1); else state.products.push(id);
    render();
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  // products that were part of the stack on a given date (membership history)
  function expectedOn(key){
    const out = [];
    const meta = state.meta || {};
    for (const id in meta){
      const m = meta[id];
      if (!m || !m.addedOn) continue;
      if (!PRODUCTS.some(p => p.id === id)) continue;
      if (m.addedOn <= key && (!m.removedOn || m.removedOn > key)) out.push(id);
    }
    return out;
  }
  function isHM(v){ return typeof v === 'string' && /^\d{1,2}:\d{2}$/.test(v); }
  function fmt12(hm){
    if (!isHM(hm)) return '';
    let [h,m] = hm.split(':').map(Number);
    const ap = h < 12 ? 'AM' : 'PM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + pad2(m) + ' ' + ap;
  }
  function schedTimeOf(id){
    if (state.schedTime && state.schedTime[id]) return state.schedTime[id];
    const legacy = state.timing && state.timing[id];
    const p = PRODUCTS.find(x => x.id === id);
    const period = legacy || (p && p.time) || 'AM';
    return period === 'PM' ? '20:00' : '08:00';
  }
  function periodOf(id){ return parseInt(schedTimeOf(id).split(':')[0], 10) < 12 ? 'AM' : 'PM'; }
  function setSchedTime(id, t){
    if (!isHM(t)) return;
    if (!state.schedTime) state.schedTime = {};
    state.schedTime[id] = t;
    saveState();
    render();
  }
  function setPeriod(id, p){ setSchedTime(id, p === 'PM' ? '20:00' : '08:00'); }

  function startProtocol(){
    if (state.products.length === 0) return;
    state.startDate = todayStr();
    if (!state.meta) state.meta = {};
    state.products.forEach(id => { state.meta[id] = { addedOn: state.startDate, removedOn: null }; });
    saveState();
    render();
  }

  // ----- add / remove bottles mid-protocol without resetting -----
  function inStack(id){ return state.products.includes(id); }
  function addToStack(id){
    if (!state.products.includes(id)) state.products.push(id);
    if (!state.meta) state.meta = {};
    state.meta[id] = { addedOn: todayStr(), removedOn: null };
    saveState(); render();
  }
  function removeFromStack(id){
    state.products = state.products.filter(x => x !== id);
    if (state.meta && state.meta[id]) state.meta[id].removedOn = todayStr();
    saveState(); render();
  }
  function toggleStack(id){ inStack(id) ? removeFromStack(id) : addToStack(id); }
  let manageOpen = false;
  function openManage(){ manageOpen = true; render(); }
  function closeManage(){ manageOpen = false; render(); }

  function toggleCheckin(id){
    const key = todayStr();
    if (!state.checkins[key]) state.checkins[key] = {};
    if (state.checkins[key][id]) delete state.checkins[key][id];
    else state.checkins[key][id] = schedTimeOf(id);
    saveState();
    render();
  }

  // ----- day-detail modal -----
  let openDayKey = null;

  // ----- monthly view (defaults to current month, auto-advances unless user navigates) -----
  function curMonthDate(){ const p = todayStr().split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, 1)); }
  function addMonthsUTC(d, delta){ return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+delta, 1)); }
  function sameMonthUTC(a, b){ return a.getUTCFullYear()===b.getUTCFullYear() && a.getUTCMonth()===b.getUTCMonth(); }
  let viewMonth = curMonthDate();
  let monthPinned = false;
  function openDay(key){ openDayKey = key; render(); }
  function closeDay(){ openDayKey = null; render(); }
  function toggleDayItem(key, id){
    if (!state.checkins[key]) state.checkins[key] = {};
    if (state.checkins[key][id]) delete state.checkins[key][id];
    else state.checkins[key][id] = schedTimeOf(id);
    saveState(); render();
  }
  function setDayItemTime(key, id, t){
    if (!isHM(t)) return;
    if (!state.checkins[key]) state.checkins[key] = {};
    state.checkins[key][id] = t;
    saveState(); render();
  }

  function setDayNote(key, text){
    if (!state.notes) state.notes = {};
    if (text.trim() === '') {
      delete state.notes[key];
    } else {
      state.notes[key] = text;
    }
    saveState();
  }

  function resetAll(){
    if (!confirm('Reset your entire protocol? This clears your streak and history.')) return;
    state = { products: [], startDate: null, checkins: {}, timing: {}, schedTime: {}, meta: {} };
    saveState();
    render();
  }

  // ----- export / import (lets a customer move their data between browsers/devices) -----
  function exportState(){
    try {
      const payload = {
        app: 'sporify-daily-protocol',
        exportedAt: new Date().toISOString(),
        state: state
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const datePart = todayStr();
      a.href = url;
      a.download = 'sporify-protocol-backup-' + datePart + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      importStatus = { ok: true, msg: 'Backup file downloaded. Keep it somewhere safe.' };
    } catch(e){
      importStatus = { ok: false, msg: 'Could not create the backup file. Please try again.' };
    }
    render();
  }

  function triggerImport(){
    const input = document.getElementById('sp-import-input');
    if (input) input.click();
  }

  function handleImportFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const incoming = parsed && parsed.state ? parsed.state : parsed;
        if (!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.products)) {
          throw new Error('not a valid backup file');
        }
        state = {
          products: Array.isArray(incoming.products) ? incoming.products : [],
          startDate: incoming.startDate || null,
          checkins: incoming.checkins || {},
          timing: incoming.timing || {},
          schedTime: incoming.schedTime || {},
          meta: incoming.meta || {}
        };
        saveState();
        importStatus = { ok: true, msg: 'Your protocol was restored on this device.' };
      } catch(err){
        importStatus = { ok: false, msg: 'That file could not be read. Make sure it is a Sporify backup file.' };
      }
      render();
    };
    reader.onerror = () => {
      importStatus = { ok: false, msg: 'Could not read that file. Please try again.' };
      render();
    };
    reader.readAsText(file);
  }

  function ringSVG(pct, label, sub){
    const r = 54, c = 2*Math.PI*r;
    const off = c - (pct/100)*c;
    return `<div class="sp-ring-wrap">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="#1f1f29" stroke-width="8"/>
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="#7fb9a8" stroke-width="8"
          stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
      </svg>
      <div class="sp-ring-num"><b>${label}</b><small>${sub}</small></div>
    </div>`;
  }

  function storageNoteHTML(opts){
    opts = opts || {};
    const dismissible = !!opts.dismissible;
    return `<div class="sp-storage-note" id="sp-storage-note">
      ${dismissible ? `<button class="sp-storage-dismiss" id="sp-storage-dismiss" aria-label="Dismiss">\u2715</button>` : ''}
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6.5" stroke="#8a8a96" stroke-width="1.3"/><path d="M8 7v4" stroke="#8a8a96" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="5.1" r="0.9" fill="#8a8a96"/></svg>
      <div>
        <div><b>Your data lives on this device.</b> Sporify saves your streak and history right in this browser, nothing is sent to a server. If you switch devices or clear browser data, use Backup to save a copy, and Restore to bring it back.</div>
        <div class="sp-storage-actions">
          <button class="sp-storage-link" id="sp-storage-export">Download a backup</button>
          <button class="sp-storage-link" id="sp-storage-import">Restore from a backup</button>
        </div>
      </div>
    </div>`;
  }

  function wireStorageNote(dismissible){
    const exportBtn = document.getElementById('sp-storage-export');
    const importBtn = document.getElementById('sp-storage-import');
    if (exportBtn) exportBtn.onclick = exportState;
    if (importBtn) importBtn.onclick = triggerImport;
    if (dismissible){
      const dismissBtn = document.getElementById('sp-storage-dismiss');
      if (dismissBtn) dismissBtn.onclick = dismissStorageNote;
    }
  }

  function dataCardHTML(){
    let statusHTML = '';
    if (importStatus){
      statusHTML = `<div class="sp-data-status show ${importStatus.ok ? '' : 'error'}">${importStatus.ok ? '✓ ' : ''}${importStatus.msg}</div>`;
    }
    return `<div class="sp-data-card">
      <h3>Your Data</h3>
      <p>Everything here is stored locally in this browser, on this device. Download a backup occasionally, or before you switch phones, computers, or browsers, then use Restore on the new one to pick up right where you left off.</p>
      <div class="sp-data-row">
        <button class="sp-data-btn" id="sp-data-export">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5v8.5M8 10l-3-3M8 10l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11.5v1.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Download backup
        </button>
        <button class="sp-data-btn" id="sp-data-import">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 10.5V2M8 2l-3 3M8 2l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11.5v1.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Restore from backup
        </button>
        <input type="file" id="sp-import-input" accept="application/json" style="display:none" />
      </div>
      ${statusHTML}
    </div>`;
  }

  function wireDataCard(){
    const exportBtn = document.getElementById('sp-data-export');
    const importBtn = document.getElementById('sp-data-import');
    const fileInput = document.getElementById('sp-import-input');
    if (exportBtn) exportBtn.onclick = exportState;
    if (importBtn) importBtn.onclick = triggerImport;
    if (fileInput) fileInput.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      handleImportFile(file);
      e.target.value = '';
    };
  }

        <div class="sp-onboard">
          <h1>Set up your daily protocol.</h1>
          <p>Sporify works on consistency, not luck. Pick what's in your stack, and we'll build your plan for the next 365 days. It keeps track of your days, your streaks, and your milestones, so you always know where you are.</p>
          <div class="sp-grid-pick" id="sp-pick-grid"></div>
          <p class="sp-timing-note"><b>Mornings work best for most people</b>, but there's no wrong time. You can take your stack whenever it fits your day, even right before bed. Set AM or PM and the exact time for each product below.</p>
          <button class="sp-start-btn" id="sp-start" disabled>Start My 365-Day Protocol</button>
          <div class="sp-onboard-restore">
            <p>Already started your protocol on another device or browser? Restore your saved progress instead of starting over.</p>
            <div class="sp-data-row">
              <button class="sp-data-btn" id="sp-onboard-import">
                <svg viewBox="0 0 16 16" fill="none"><path d="M8 10.5V2M8 2l-3 3M8 2l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11.5v1.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

        </div>
      </div>`;

    const grid = document.getElementById('sp-pick-grid');
    PRODUCTS.forEach(p => {
      const active = state.products.includes(p.id);
      const per = periodOf(p.id);
      const st = schedTimeOf(p.id);
      const el = document.createElement('div');
      el.className = 'sp-pick' + (active ? ' active' : '');
      el.innerHTML = `<div class="sp-pick-name">${p.name}</div>` + (active
        ? `<div class="sp-sched">
             <div class="sp-timing">
               <button type="button" class="sp-time-opt ${per==='AM'?'on':''}" data-t="AM">AM</button>
               <button type="button" class="sp-time-opt ${per==='PM'?'on':''}" data-t="PM">PM</button>
             </div>
             <input type="time" class="sp-time-input" value="${st}" aria-label="Time for ${p.name}" />
           </div>`
        : `<div class="sp-pick-time">Recommended: ${p.time}</div>`);
      el.onclick = () => toggleProduct(p.id);
      if (active){
        el.querySelectorAll('.sp-time-opt').forEach(btn => {
          btn.onclick = (e) => { e.stopPropagation(); setPeriod(p.id, btn.getAttribute('data-t')); };
        });
        const ti = el.querySelector('.sp-time-input');
        ti.onclick = (e) => e.stopPropagation();
        ti.onchange = (e) => { e.stopPropagation(); setSchedTime(p.id, e.target.value); };
      }
      grid.appendChild(el);
    });
    const btn = document.getElementById('sp-start');
    btn.disabled = state.products.length === 0;
    btn.onclick = startProtocol;

    wireStorageNote(false);

    const onboardImportBtn = document.getElementById('sp-onboard-import');
    const onboardFileInput = document.getElementById('sp-import-input');
    if (onboardImportBtn) onboardImportBtn.onclick = () => onboardFileInput && onboardFileInput.click();
    if (onboardFileInput) onboardFileInput.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      handleImportFile(file);
      e.target.value = '';
    };
  }

          <div class="sp-header-actions">

        ${storageNoteDismissed ? '' : storageNoteHTML({dismissible:true})}

        <div class="sp-today">
          <div class="sp-ring-col">
            ${ringSVG(pct, 'D'+Math.min(d,365), 'of 365')}
            <div class="sp-phase-tag">${phase.name} Phase</div>
          </div>

            <div class="sp-checklist" id="sp-checklist"></div>
            ${completed===total && total>0 ? `<div class="sp-all-done">✓ All done for today. Your streak is locked in.</div>` : ''}

          <div class="sp-stat"><b class="mono">${fullDays}</b><span>Full Days Logged</span></div>
          <div class="sp-stat"><b class="mono">${d <= 365 ? d : ((d-1)%365)+1}</b><span>${d<=365? 'Day In Protocol':'Day In Year '+(Math.floor((d-1)/365)+1)}</span></div>
        </div>

        <div class="sp-year-card">
          <div class="sp-year-head">
            <h3>Year at a Glance</h3>
            <div class="sp-year-legend">
              <span class="sp-legend-sq" style="background:#1c1c27"></span> none
              <span class="sp-legend-sq" style="background:rgba(74,122,155,0.55)"></span> partial
              <span class="sp-legend-sq" style="background:#7fb9a8"></span> full
            </div>
          </div>
          <div class="sp-grid-scroll" id="sp-year-grid"></div>
        </div>

        <div class="sp-month-card">
          <div class="sp-month-head">
            <h3>Monthly Glance</h3>
            <div class="sp-month-nav">
              <button class="sp-mnav" id="sp-prev-month" aria-label="Previous month">‹</button>
              <span class="sp-month-label" id="sp-month-label"></span>
              <button class="sp-mnav" id="sp-next-month" aria-label="Next month">›</button>
              <button class="sp-month-today" id="sp-month-today">Today</button>

          <div class="sp-month-grid" id="sp-month-grid"></div>
          <div class="sp-month-legend">
            <span class="sp-legend-sq" style="background:#1c1c27"></span> none
            <span class="sp-legend-sq" style="background:rgba(74,122,155,0.55)"></span> partial
            <span class="sp-legend-sq" style="background:#7fb9a8"></span> full

      </div>`;

    // checklist
    const checklistEl = document.getElementById('sp-checklist');
    state.products.forEach(id => {
      const p = PRODUCTS.find(x => x.id === id);
      const isDone = !!todayRec[id];
      const per = periodOf(id);
      const st = schedTimeOf(id);
      const item = document.createElement('div');
      item.className = 'sp-item' + (isDone ? ' done' : '');
      item.innerHTML = `<div class="sp-check"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="${'#0a1410'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="sp-item-name">${p.name}</div>
        <div class="sp-item-sched">
          <span class="sp-item-time sp-item-timing" title="Switch AM / PM">${per}</span>
          <input type="time" class="sp-time-input" value="${st}" aria-label="Time for ${p.name}" />
        </div>`;
      item.onclick = () => toggleCheckin(id);
      const pill = item.querySelector('.sp-item-timing');
      pill.onclick = (e) => { e.stopPropagation(); setPeriod(id, periodOf(id)==='AM' ? 'PM' : 'AM'); };
      const ti = item.querySelector('.sp-time-input');
      ti.onclick = (e) => e.stopPropagation();
      ti.onchange = (e) => { e.stopPropagation(); setSchedTime(id, e.target.value); };
      checklistEl.appendChild(item);
    });

    // year grid (53 weeks, starting from protocol start date, Sun-Sat columns)
    const gridEl = document.getElementById('sp-year-grid');
    const start = new Date(state.startDate);
    const startDow = start.getDay();
    const gridStart = new Date(start.getTime() - startDow*86400000);
    const weeks = 53;
    let monthsRowHTML = '<div class="sp-months-row">';
    let lastMonth = -1;
    const weekDivs = [];
    for (let w=0; w<weeks; w++){
      const weekStart = new Date(gridStart.getTime() + w*7*86400000);
      const m = weekStart.getMonth();
      if (m !== lastMonth){
        monthsRowHTML += `<span style="width:14px;flex-shrink:0">${weekStart.toLocaleDateString('en-US',{month:'short'})}</span>`;
        lastMonth = m;
      } else {
        monthsRowHTML += `<span style="width:14px;flex-shrink:0"></span>`;
      }
      let dayCells = '';
      for (let dd=0; dd<7; dd++){
        const cellDate = new Date(weekStart.getTime() + dd*86400000);
        const key = cellDate.toISOString().slice(0,10);
        const isFuture = cellDate > new Date(todayKey);
        const isToday = key === todayKey;
        const rec = state.checkins[key];
        let cls = 'sp-day';
        if (isFuture) cls += ' future';
        else {
          const exp = expectedOn(key);
          const c = exp.filter(id => rec && rec[id]).length;
          if (exp.length > 0 && c === exp.length) cls += ' full';
          else if (c > 0) cls += ' partial';
          else if (exp.length > 0 && cellDate >= start) cls += ' missed';
        }
        const inRange = (cellDate >= start) && !isFuture;
        if (inRange) cls += ' clickable';
        if (isToday) cls += ' today';
        dayCells += `<div class="${cls}" data-key="${key}" title="${key}"></div>`;
      }
      weekDivs.push(`<div class="sp-week">${dayCells}</div>`);
    }
    monthsRowHTML += '</div>';
    gridEl.innerHTML = monthsRowHTML +
      `<div class="sp-weeks">
        <div class="sp-dow"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
        ${weekDivs.join('')}
      </div>`;
    gridEl.querySelectorAll('.sp-day.clickable').forEach(c => {
      c.onclick = () => openDay(c.getAttribute('data-key'));
    });

    renderMonth();

    // phase list
    const phaseListEl = document.getElementById('sp-phase-list');
    PHASES.forEach(p => {
      const active = phase === p;
      const row = document.createElement('div');
      row.className = 'sp-phase-row' + (active ? ' active' : '');
      row.innerHTML = `<div class="sp-phase-days mono">D${p.range[0]}–${p.range[1]}</div>
        <div class="sp-phase-body"><b>${p.name}</b><p>${p.desc}</p></div>`;
      phaseListEl.appendChild(row);
    });

    // milestones
    const milestonesEl = document.getElementById('sp-milestones');
    MILESTONES.forEach(m => {
      const hit = d >= m;
      const b = document.createElement('div');
      b.className = 'sp-badge' + (hit ? ' hit' : '');
      b.textContent = (hit ? '✓ ' : '') + 'Day ' + m;
      milestonesEl.appendChild(b);
    });

    document.getElementById('sp-reset-btn').onclick = resetAll;
    document.getElementById('sp-manage-btn').onclick = openManage;

    if (!storageNoteDismissed) wireStorageNote(true);
    wireDataCard();

    if (openDayKey) renderDayModal();
    if (manageOpen) renderManageModal();
  }

  function renderManageModal(){
    const inCount = state.products.length;
    const rows = PRODUCTS.map(p => {
      const on = inStack(p.id);
      const per = periodOf(p.id);
      const st = schedTimeOf(p.id);
      const ctrl = on
        ? `<div class="sp-sched">
             <div class="sp-timing">
               <button type="button" class="sp-time-opt ${per==='AM'?'on':''}" data-id="${p.id}" data-t="AM">AM</button>
               <button type="button" class="sp-time-opt ${per==='PM'?'on':''}" data-id="${p.id}" data-t="PM">PM</button>
             </div>
             <input type="time" class="sp-time-input" data-id="${p.id}" value="${st}" aria-label="Time for ${p.name}" />
           </div>`
        : `<span class="sp-dmuted">Tap to add</span>`;
      return `<div class="sp-drow ${on ? 'taken' : ''}" data-id="${p.id}">
          <div class="sp-dcheck"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#0a1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="sp-dname">${p.name}</div>
          <div class="sp-mctrl">${ctrl}</div>
        </div>`;
    }).join('');
    const overlay = document.createElement('div');
    overlay.className = 'sp-modal-bg';
    overlay.innerHTML = `
      <div class="sp-modal" role="dialog" aria-modal="true">
        <div class="sp-modal-head">
          <h3>Manage Your Stack</h3>
          <button class="sp-modal-close" aria-label="Close">\u2715</button>
        </div>
        <div class="sp-modal-sub">${inCount} ${inCount === 1 ? 'bottle' : 'bottles'} in your stack</div>
        <div class="sp-dlist">${rows}</div>
        <p class="sp-modal-note">You can add or remove a bottle anytime, and <b>your streak and history stay the same.</b> New changes start from today. Past days keep the stack you had back then.</p>
      </div>`;
    root.appendChild(overlay);
    overlay.onclick = (e) => { if (e.target === overlay) closeManage(); };
    overlay.querySelector('.sp-modal-close').onclick = closeManage;
    overlay.querySelectorAll('.sp-drow').forEach(r => {
      r.onclick = () => toggleStack(r.getAttribute('data-id'));
    });
    overlay.querySelectorAll('.sp-time-opt').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); setPeriod(btn.getAttribute('data-id'), btn.getAttribute('data-t')); };
    });
    overlay.querySelectorAll('.sp-time-input').forEach(inp => {
      inp.onclick = (e) => e.stopPropagation();
      inp.onchange = (e) => { e.stopPropagation(); setSchedTime(inp.getAttribute('data-id'), e.target.value); };
    });
  }

  function renderMonth(){
    const grid = document.getElementById('sp-month-grid');
    if (!grid) return;
    if (!monthPinned) viewMonth = curMonthDate();
    const y = viewMonth.getUTCFullYear(), m = viewMonth.getUTCMonth();
    const todayKey = todayStr();
    const startKey = state.startDate || todayKey;
    const total = state.products.length;

    const labelEl = document.getElementById('sp-month-label');
    if (labelEl) labelEl.textContent = new Date(Date.UTC(y, m, 1))
      .toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' });

    const firstDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(y, m+1, 0)).getUTCDate();

    let cells = '';
    for (let i=0; i<firstDow; i++) cells += '<div class="sp-mday blank"></div>';
    for (let d=1; d<=daysInMonth; d++){
      const key = y + '-' + pad2(m+1) + '-' + pad2(d);
      const isFuture = key > todayKey;
      const isToday = key === todayKey;
      const rec = state.checkins[key];
      let cls = 'sp-mday';
      if (isFuture) cls += ' future';
      else {
        const exp = expectedOn(key);
        const c = exp.filter(id => rec && rec[id]).length;
        if (exp.length > 0 && c === exp.length) cls += ' full';
        else if (c > 0) cls += ' partial';
        else if (exp.length > 0 && key >= startKey) cls += ' missed';
      }
      const inRange = (key >= startKey) && !isFuture;
      if (inRange) cls += ' clickable';
      if (isToday) cls += ' today';
      cells += '<div class="' + cls + '" data-key="' + key + '">' + d + '</div>';
    }
    grid.innerHTML = cells;
    grid.querySelectorAll('.sp-mday.clickable').forEach(c => {
      c.onclick = () => openDay(c.getAttribute('data-key'));
    });

    const prev = document.getElementById('sp-prev-month');
    const next = document.getElementById('sp-next-month');
    const todayBtn = document.getElementById('sp-month-today');
    if (prev) prev.onclick = () => { monthPinned = true; viewMonth = addMonthsUTC(viewMonth, -1); renderMonth(); };
    if (next) next.onclick = () => { monthPinned = true; viewMonth = addMonthsUTC(viewMonth, 1); renderMonth(); };
    if (todayBtn){
      const onCurrent = sameMonthUTC(viewMonth, curMonthDate());
      todayBtn.style.display = onCurrent ? 'none' : '';
      todayBtn.onclick = () => { monthPinned = false; viewMonth = curMonthDate(); renderMonth(); };
    }
  }

  function renderDayModal(){
    const key = openDayKey;
    const rec = state.checkins[key] || {};
    const dateObj = new Date(key + 'T00:00:00');
    const dateLabel = dateObj.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
    const expected = expectedOn(key);
    const total = expected.length;
    const takenCount = expected.filter(id => rec[id]).length;
    const existingNote = (state.notes && state.notes[key]) || '';
    const rows = expected.map(id => {
      const p = PRODUCTS.find(x => x.id === id);
      const val = rec[id];
      const taken = !!val;
      const timeCtrl = taken
        ? `<input type="time" class="sp-time-input" value="${isHM(val) ? val : schedTimeOf(id)}" data-id="${id}" aria-label="Time taken for ${p.name}" />`
        : `<span class="sp-dmuted">Not logged</span>`;
      return `<div class="sp-drow ${taken ? 'taken' : ''}" data-id="${id}">
          <div class="sp-dcheck"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#0a1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="sp-dname">${p.name}</div>
          <div class="sp-dtime">${timeCtrl}</div>
        </div>`;
    }).join('');
    const overlay = document.createElement('div');
    overlay.className = 'sp-modal-bg';
    overlay.innerHTML = `
      <div class="sp-modal" role="dialog" aria-modal="true">
        <div class="sp-modal-head">
          <h3>${dateLabel}</h3>
          <button class="sp-modal-close" aria-label="Close">\u2715</button>
        </div>
        <div class="sp-modal-sub">${takenCount} of ${total} taken</div>
        <div class="sp-dlist">${rows || '<div class="sp-dmuted">No products in your protocol.</div>'}</div>
        <p class="sp-modal-note">Tap a row to mark it taken, then set the time you took each one.</p>
        <div class="sp-notes-wrap">
          <div class="sp-notes-label">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 2.5h11a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6l-3.5 2V3.5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            Daily Reflection
          </div>
          <textarea class="sp-notes-area" id="sp-notes-area" placeholder="How are you feeling today? Any changes you've noticed, energy levels, sleep, focus — write it here." rows="4">${existingNote.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
          <div class="sp-notes-saved" id="sp-notes-saved">${existingNote ? 'Note saved' : ''}</div>
        </div>
      </div>`;
    root.appendChild(overlay);
    overlay.onclick = (e) => { if (e.target === overlay) closeDay(); };
    overlay.querySelector('.sp-modal-close').onclick = closeDay;
    overlay.querySelectorAll('.sp-drow').forEach(r => {
      r.onclick = () => toggleDayItem(key, r.getAttribute('data-id'));
    });
    overlay.querySelectorAll('.sp-time-input').forEach(inp => {
      inp.onclick = (e) => e.stopPropagation();
      inp.onchange = (e) => { e.stopPropagation(); setDayItemTime(key, inp.getAttribute('data-id'), e.target.value); };
    });

    // --- notes textarea: auto-grow + debounced save ---
    const textarea = overlay.querySelector('#sp-notes-area');
    const savedLabel = overlay.querySelector('#sp-notes-saved');
    let saveTimer = null;

    function autoGrow(){
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function flashSaved(){
      savedLabel.textContent = 'Saved';
      savedLabel.classList.add('flash');
      setTimeout(() => savedLabel.classList.remove('flash'), 1200);
      setTimeout(() => { savedLabel.textContent = 'Note saved'; }, 1300);
    }

    textarea.addEventListener('input', () => {
      autoGrow();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        setDayNote(key, textarea.value);
        flashSaved();
      }, 600);
    });

    textarea.onclick = (e) => e.stopPropagation();

    // initial height
    setTimeout(autoGrow, 0);
  }

  function render(){
    if (!loaded) { root.innerHTML = '<div style="padding:60px;text-align:center;color:#888;font-family:sans-serif;">Loading your protocol…</div>'; return; }
    if (!state.startDate) renderOnboard();
    else renderMain();
  }

  loadState();
})();
</script>
